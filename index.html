<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>艾欧泽亚冒险记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* 布局概念：全屏 3D 画布 + 四角锚定的半透明游戏 HUD（仿 FF14 默认暗色 UI）；单一深色视觉世界 */
:root {
  --ink: #0b0d12; --panel: rgba(22, 22, 27, 0.86); --panel-2: rgba(38, 36, 42, 0.92); --line: rgba(255, 255, 255, 0.14);
  --text: #eeeae0; --muted: #a8a294; --gold: #e6c982; --gold-2: #b8913e; --blue: #5aa8ff; --hp: #6fcf5a; --mp: #d05aa8; --red: #ff5a4a; --orange: #ff9a3a; --green: #7dffa8;
  --f-display: "Noto Serif SC", "Songti SC", "SimSun", serif; --f-latin: Cinzel, "Times New Roman", serif; --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: var(--text); font-family: var(--f-body); font-size: 13px; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font-family: inherit; }
#app { position: fixed; inset: 0; user-select: none; -webkit-user-select: none; }
#gl { position: absolute; inset: 0; }
#gl canvas { display: block; width: 100% !important; height: 100% !important; }
.layer { position: absolute; inset: 0; pointer-events: none; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 4px 18px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06); }
.gold { color: var(--gold); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.btn { pointer-events: auto; cursor: pointer; border: 1px solid rgba(230, 201, 130, 0.45); background: linear-gradient(180deg, #4a4438, #2a2620); color: var(--text); padding: 7px 16px; border-radius: 4px; font-size: 13px; letter-spacing: 0.04em; transition: filter .12s, transform .12s; }
.btn:hover { filter: brightness(1.25); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible, .slot:focus-visible, .tab:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.btn.primary { background: linear-gradient(180deg, #3a6aa8, #1f3a64); border-color: rgba(120, 180, 255, 0.6); }
.btn.ghost { background: rgba(0,0,0,0.25); }
.btn:disabled { opacity: .45; cursor: default; filter: none; }

/* ---------- 标题画面 ---------- */
#title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; pointer-events: auto; background: radial-gradient(ellipse at 50% 40%, rgba(20,40,80,0) 0%, rgba(5,8,18,0.55) 70%); padding-inline: 16px; }
.logo { text-align: center; animation: logoIn 2.4s cubic-bezier(.2,.7,.2,1) both; }
.logo .kicker { font-family: var(--f-latin); letter-spacing: 0.6em; font-size: 12px; color: #9fc6ff; opacity: .85; margin-bottom: 14px; padding-left: .6em; }
.logo h1 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: clamp(44px, 8vw, 96px); letter-spacing: 0.12em; line-height: 1.05; background: linear-gradient(180deg, #fff8e0 0%, #f0d690 45%, #b8862e 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 22px rgba(120, 180, 255, 0.35)) drop-shadow(0 4px 2px rgba(0,0,0,0.6)); text-wrap: balance; }
.logo .en { font-family: var(--f-latin); font-weight: 700; letter-spacing: 0.42em; font-size: clamp(13px, 1.8vw, 20px); color: #dfe8ff; margin-top: 10px; padding-left: .42em; text-shadow: 0 0 12px rgba(90,168,255,.7); }
.logo .rule { width: min(520px, 80vw); height: 1px; margin: 18px auto 0; background: linear-gradient(90deg, transparent, rgba(230,201,130,.9), transparent); }
@keyframes logoIn { from { opacity: 0; transform: translateY(12px); letter-spacing: 0.3em; filter: blur(6px); } }
.menu { display: flex; flex-direction: column; gap: 6px; align-items: center; animation: fadeUp 1.2s .8s both; }
.menu button { pointer-events: auto; background: none; border: 0; color: #e8e4d8; font-family: var(--f-display); font-size: 20px; letter-spacing: 0.3em; padding: 8px 32px; cursor: pointer; position: relative; text-shadow: 0 2px 6px #000; transition: color .2s, text-shadow .2s; }
.menu button::before, .menu button::after { content: ''; position: absolute; top: 50%; width: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); transition: width .25s; }
.menu button::before { right: 100%; } .menu button::after { left: 100%; transform: scaleX(-1); }
.menu button:hover, .menu button:focus-visible { color: #fff; text-shadow: 0 0 14px rgba(120,190,255,.9), 0 2px 6px #000; outline: none; }
.menu button:hover::before, .menu button:hover::after { width: 60px; }
.menu button:disabled { opacity: .35; cursor: default; }
.disclaimer { position: absolute; bottom: 14px; left: 16px; right: 16px; text-align: center; font-size: 11px; color: rgba(220, 215, 200, 0.55); letter-spacing: .05em; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } }

/* ---------- 捏脸 ---------- */
#creator { position: absolute; inset: 0; pointer-events: none; }
#creator .cpanel { pointer-events: auto; position: absolute; left: 16px; top: 16px; bottom: 76px; width: 380px; max-width: calc(100vw - 32px); display: flex; flex-direction: column; }
.cc-head { padding: 14px 18px 10px; border-bottom: 1px solid var(--line); }
.cc-head h2 { margin: 0; font-family: var(--f-display); font-size: 20px; color: var(--gold); letter-spacing: .15em; }
.cc-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
.tabs { display: flex; gap: 2px; padding: 8px 10px 0; flex-wrap: wrap; }
.tab { pointer-events: auto; cursor: pointer; background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-bottom: 0; color: var(--muted); padding: 6px 11px; border-radius: 5px 5px 0 0; font-size: 12.5px; }
.tab.on { color: #fff; background: rgba(90, 168, 255, 0.18); border-color: rgba(90,168,255,.5); }
.cc-body { flex: 1; overflow-y: auto; padding: 14px 18px; border-top: 1px solid var(--line); min-height: 0; }
.cc-body::-webkit-scrollbar, .scroll::-webkit-scrollbar { width: 6px; } .cc-body::-webkit-scrollbar-thumb, .scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 3px; }
.field { margin-bottom: 16px; }
.field > label, .field > .lab { display: block; font-size: 12px; color: var(--gold); margin-bottom: 7px; letter-spacing: .08em; }
.grid-opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.grid-opts.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.opt { pointer-events: auto; cursor: pointer; padding: 8px 8px; background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 4px; color: var(--text); font-size: 12.5px; text-align: left; }
.opt small { display: block; color: var(--muted); font-family: var(--f-latin); font-size: 9.5px; letter-spacing: .12em; margin-top: 2px; }
.opt.on { background: rgba(90,168,255,.2); border-color: var(--blue); box-shadow: inset 0 0 0 1px rgba(90,168,255,.4); }
.opt:hover { background: rgba(255,255,255,0.09); }
.swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
.sw { pointer-events: auto; cursor: pointer; aspect-ratio: 1; border-radius: 3px; border: 1px solid rgba(0,0,0,.5); box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
.sw.on { outline: 2px solid #fff; outline-offset: 1px; }
.slider { width: 100%; pointer-events: auto; accent-color: var(--blue); }
.desc { color: var(--muted); font-size: 12px; line-height: 1.7; margin: 6px 0 0; }
.jobcard { display: flex; gap: 10px; align-items: center; }
.jobcard img { width: 34px; height: 34px; border-radius: 6px; }
.text-in { pointer-events: auto; width: 100%; padding: 8px 10px; background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 4px; color: #fff; font-size: 14px; font-family: inherit; }
.text-in:focus { outline: 1px solid var(--blue); }
select.text-in { font-size: 13px; }
#creator .cbar { pointer-events: auto; position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
#creator .cbar .grp { display: flex; gap: 8px; flex-wrap: wrap; }
#creator .ctitle { position: absolute; right: 24px; top: 20px; text-align: right; pointer-events: none; }
#creator .ctitle .rn { font-family: var(--f-display); font-size: 34px; color: #fff; text-shadow: 0 2px 10px #000; letter-spacing: .1em; }
#creator .ctitle .re { font-family: var(--f-latin); letter-spacing: .4em; color: var(--gold); font-size: 13px; }
#creator .ctitle .rc { color: var(--muted); margin-top: 4px; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; }
.anchor { position: absolute; }
#party { left: 14px; top: 14px; width: 250px; transform-origin: top left; transform: scale(var(--ui, 1)); }
.pm { display: grid; grid-template-columns: 26px 1fr; gap: 2px 8px; align-items: center; padding: 6px 8px; margin-bottom: 4px; border-radius: 4px; background: rgba(15,15,18,.55); border: 1px solid transparent; pointer-events: auto; cursor: pointer; }
.pm.sel { border-color: rgba(255,255,255,.55); background: rgba(90,168,255,.14); }
.pm.dead { opacity: .5; }
.pm .ji { width: 26px; height: 26px; border-radius: 50%; grid-row: span 2; }
.pm .nm { font-size: 12.5px; display: flex; justify-content: space-between; gap: 6px; }
.pm .nm .lv { color: var(--muted); font-size: 11px; }
.bars { display: grid; grid-template-columns: 1fr 64px; gap: 4px; align-items: center; }
.bar { height: 7px; background: rgba(0,0,0,.6); border-radius: 4px; overflow: hidden; position: relative; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(180deg, #9aff7a, var(--hp)); border-radius: 4px; transition: width .2s; }
.bar.mp > i { background: linear-gradient(180deg, #ff9ad8, var(--mp)); }
.bar.lowhp > i { background: linear-gradient(180deg, #ffb07a, #e85a3a); }
.pm .hpn { font-size: 11px; text-align: right; }
.pm .sts { grid-column: 2; display: flex; gap: 2px; min-height: 0; }
.pm .sts img { width: 14px; height: 14px; border-radius: 2px; }
#enmity { left: 14px; width: 250px; transform-origin: top left; transform: scale(var(--ui, 1)); }
#enmity .row { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 8px; }
#enmity .row b { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
#target { left: 50%; top: 16px; width: 520px; transform: translateX(-50%) scale(var(--ui, 1)); transform-origin: top center; text-align: center; }
#target .tn { font-size: 15px; text-shadow: 0 1px 3px #000, 0 0 6px #000; margin-bottom: 4px; display: flex; justify-content: center; align-items: baseline; gap: 8px; }
#target .tn .tlv { font-size: 12px; color: var(--muted); }
#target .tn .ttag { font-size: 11px; color: var(--orange); }
#target .thp { height: 12px; background: rgba(0,0,0,.65); border-radius: 6px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,.25); }
#target .thp i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(180deg, #ffb07a, #e0503a); transition: width .15s; }
#target.friendly .thp i { background: linear-gradient(180deg, #9aff7a, var(--hp)); }
#target .tpct { position: absolute; right: 8px; top: -1px; font-size: 11px; text-shadow: 0 0 3px #000; }
#target .tcast { margin: 6px auto 0; width: 70%; }
#target .tcast .cn { font-size: 12px; color: #ffd0a0; text-shadow: 0 0 4px #000; }
#target .tcast .cb { height: 6px; background: rgba(0,0,0,.6); border-radius: 3px; overflow: hidden; margin-top: 2px; border: 1px solid rgba(255,160,90,.5); }
#target .tcast .cb i { display: block; height: 100%; background: linear-gradient(90deg, #ff7a3a, #ffd08a); }
#target .tt { margin-top: 5px; font-size: 11.5px; color: var(--muted); text-shadow: 0 0 4px #000; }
#target .tsts { display: flex; gap: 3px; justify-content: center; margin-top: 5px; }
.sti { position: relative; width: 24px; text-align: center; font-size: 10px; color: #fff; text-shadow: 0 0 3px #000; }
.sti img { width: 24px; height: 24px; border-radius: 3px; display: block; }
.sti.debuff img { box-shadow: 0 0 0 1px #ff5a4a; }
#mm { right: 14px; top: 12px; width: 212px; transform-origin: top right; transform: scale(var(--ui, 1)); }
#mm .zn { text-align: right; font-family: var(--f-display); font-size: 14px; color: #fff; text-shadow: 0 1px 4px #000; padding-right: 4px; }
#mm .zs { text-align: right; font-size: 11px; color: var(--muted); padding-right: 4px; margin-bottom: 4px; text-shadow: 0 1px 3px #000; }
#mm .ring { width: 200px; height: 200px; margin-left: auto; border-radius: 50%; overflow: hidden; border: 3px solid #6a5a3a; box-shadow: 0 0 0 1px #000, 0 0 0 5px rgba(20,18,14,.8), 0 0 0 6px #a88a4a, 0 6px 20px rgba(0,0,0,.6); position: relative; background: #1a2a3a; }
#mm canvas { display: block; }
#mm .n { position: absolute; top: 2px; left: 50%; transform: translateX(-50%); font-family: var(--f-latin); font-size: 11px; color: var(--gold); text-shadow: 0 0 3px #000; }
#mm .clock { text-align: right; margin-top: 10px; font-size: 12px; color: #fff; text-shadow: 0 1px 3px #000; padding-right: 4px; }
#mm .net { text-align: right; margin-top: 3px; font-size: 12px; color: var(--muted); text-shadow: 0 1px 3px #000; padding-right: 4px; }
#mm .net.online { color: #8fe07a; } #mm .net.connecting, #mm .net.reconnecting { color: #ffd27a; } #mm .net.solo { color: #9fc6ff; }
#tracker { right: 14px; top: calc(292px * var(--ui, 1)); width: 260px; transform-origin: top right; transform: scale(var(--ui, 1)); }
.tq { padding: 8px 10px; margin-bottom: 6px; background: linear-gradient(90deg, rgba(0,0,0,0), rgba(10,10,14,.65) 30%); border-radius: 4px; pointer-events: auto; cursor: pointer; text-align: right; }
.tq .qt { font-size: 13px; display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
.tq .qt img { width: 18px; height: 18px; }
.tq.msq .qt { color: #ffcf6a; }
.tq .qs { font-size: 12px; color: #d8d4c8; margin-top: 3px; line-height: 1.5; }
.tq .qs b { color: #fff; font-weight: 500; }
#duty { right: 14px; width: 260px; padding: 10px 12px; transform-origin: top right; transform: scale(var(--ui, 1)); }
#duty h4, #fate h4 { margin: 0 0 6px; font-family: var(--f-display); font-size: 14px; color: var(--gold); display: flex; justify-content: space-between; gap: 8px; }
#duty .obj { font-size: 12px; display: flex; justify-content: space-between; padding: 2px 0; }
#duty .obj.done { color: var(--muted); text-decoration: line-through; }
#fate { right: 14px; width: 260px; padding: 10px 12px; border-color: rgba(255, 150, 60, .5); transform-origin: top right; transform: scale(var(--ui, 1)); }
#fate .fbar { height: 8px; border-radius: 4px; background: rgba(0,0,0,.6); overflow: hidden; margin: 6px 0 4px; }
#fate .fbar i { display: block; height: 100%; background: linear-gradient(90deg, #ff8a3a, #ffd060); }
#chat { left: 14px; bottom: 14px; width: 440px; height: 210px; display: flex; flex-direction: column; pointer-events: auto; transform-origin: bottom left; transform: scale(var(--ui, 1)); }
#chat .ctabs { display: flex; gap: 2px; padding: 4px 6px 0; }
#chat .ctabs .tab { font-size: 11.5px; padding: 3px 10px; }
#chat .log { flex: 1; overflow-y: auto; padding: 6px 10px; font-size: 12.5px; line-height: 1.55; min-height: 0; }
#chat .log p { margin: 0; overflow-wrap: anywhere; }
#chat .log .system { color: #e8e0b8; } #chat .log .say { color: #f4f4f4; } #chat .log .npc { color: #e8d0ff; } #chat .log .quest { color: #ffcf6a; }
#chat .log .battle { color: #b8c8d8; } #chat .log .battle-in { color: #ffb0a0; } #chat .log .battle-warn { color: #ff9a5a; font-weight: 500; } #chat .log .loot { color: #9affc8; } #chat .log .error { color: #ff7a6a; } #chat .log .emote { color: #b8ffd0; } #chat .log .levelup { color: #ffe070; font-weight: 700; } #chat .log .fate { color: #ffb070; }
#chat .log .ts { color: rgba(255,255,255,.35); margin-right: 5px; font-size: 11px; }
#chat .cin { display: flex; gap: 6px; padding: 6px; border-top: 1px solid var(--line); }
#chat input { flex: 1; min-width: 0; background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 3px; padding: 5px 8px; color: #fff; font-family: inherit; font-size: 12.5px; }
#chat input:focus { outline: 1px solid var(--blue); }
#bottom { left: 50%; bottom: 12px; transform: translateX(-50%) scale(var(--ui, 1)); transform-origin: bottom center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
#pcast { width: 300px; text-align: center; margin-bottom: 26px; }
#pcast .cn { font-size: 13px; text-shadow: 0 0 4px #000, 0 1px 2px #000; display: flex; justify-content: space-between; }
#pcast .cb { height: 8px; border-radius: 4px; overflow: hidden; background: rgba(0,0,0,.65); border: 1px solid rgba(160,200,255,.5); margin-top: 3px; }
#pcast .cb i { display: block; height: 100%; background: linear-gradient(90deg, #5aa8ff, #c8f0ff); }
#pstatus { display: flex; gap: 4px; min-height: 36px; align-items: flex-end; }
#params { display: flex; gap: 14px; align-items: flex-end; }
.pbar { width: 170px; }
.pbar .lab { display: flex; justify-content: space-between; font-size: 11px; text-shadow: 0 1px 2px #000; }
.pbar .lab b { font-size: 16px; font-weight: 500; letter-spacing: .02em; }
.pbar .bar { height: 9px; }
#lbbar { width: 170px; }
#lbbar .lab { font-size: 11px; display: flex; justify-content: space-between; text-shadow: 0 1px 2px #000; }
#lbbar .bar > i { background: linear-gradient(180deg, #8ad0ff, #2a7ae8); }
#lbbar.full .bar > i { background: linear-gradient(90deg, #ffe07a, #5ab0ff, #ffe07a); background-size: 200% 100%; animation: lbflow 1.2s linear infinite; }
@keyframes lbflow { to { background-position: 200% 0; } }
.hotbar { display: flex; gap: 4px; padding: 5px; border-radius: 6px; background: rgba(12,12,16,.55); border: 1px solid rgba(255,255,255,.08); pointer-events: auto; }
.slot { position: relative; width: 44px; height: 44px; border-radius: 7px; cursor: pointer; background: rgba(0,0,0,.45); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); overflow: hidden; }
.slot img { width: 100%; height: 100%; display: block; border-radius: 7px; }
.slot .key { position: absolute; left: 3px; top: 1px; font-size: 10px; font-weight: 700; color: #fff; text-shadow: 0 0 2px #000, 0 0 3px #000; font-family: var(--f-latin); }
.slot .cdv { position: absolute; inset: 0; border-radius: 7px; background: conic-gradient(rgba(0,0,0,.72) var(--p), rgba(0,0,0,0) 0); }
.slot .cdt { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; font-weight: 700; color: #fff; text-shadow: 0 0 3px #000, 0 0 5px #000; }
.slot .cnt { position: absolute; right: 3px; bottom: 1px; font-size: 11px; font-weight: 700; color: #fff; text-shadow: 0 0 3px #000; }
.slot.dis img { filter: grayscale(.8) brightness(.5); }
.slot.oor::after { content: ''; position: absolute; inset: 0; background: rgba(200,40,30,.35); border-radius: 7px; }
.slot.combo { box-shadow: 0 0 0 2px #ffe07a, 0 0 12px rgba(255,220,120,.9); animation: combo 0.9s ease-in-out infinite alternate; }
.slot.proc { box-shadow: 0 0 0 2px #7ad8ff, 0 0 12px rgba(120,210,255,.9); animation: combo 0.6s ease-in-out infinite alternate; }
@keyframes combo { to { box-shadow: 0 0 0 2px #fff4c0, 0 0 20px rgba(255,220,120,1); } }
.slot.press { transform: scale(.92); }
.slot.locked { opacity: .35; }
.slot.empty { background: rgba(0,0,0,.25); }
#expbar { width: 560px; max-width: 90vw; }
#expbar .lab { display: flex; justify-content: space-between; font-size: 11px; text-shadow: 0 1px 2px #000; margin-bottom: 2px; }
#expbar .bar { height: 5px; } #expbar .bar > i { background: linear-gradient(90deg, #d8a83a, #ffe07a); }
#menubar { right: 14px; bottom: 14px; display: flex; gap: 4px; pointer-events: auto; transform-origin: bottom right; transform: scale(var(--ui, 1)); }
#menubar button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(230,201,130,.45); background: radial-gradient(circle at 50% 35%, #4a4438, #1c1a16); color: var(--gold); font-size: 15px; cursor: pointer; font-family: var(--f-display); }
#menubar button:hover { filter: brightness(1.35); }
#prompt { left: 50%; top: 62%; transform: translateX(-50%); padding: 6px 14px; font-size: 13px; }
#prompt kbd { display: inline-block; padding: 0 6px; margin-right: 6px; border-radius: 3px; background: #e6c982; color: #1a1408; font-weight: 700; font-family: var(--f-latin); }
#err { left: 50%; top: 30%; transform: translateX(-50%); font-size: 17px; color: #ffd8c8; text-shadow: 0 0 4px #000, 0 0 10px rgba(255,60,40,.8), 0 2px 2px #000; white-space: nowrap; opacity: 0; transition: opacity .2s; font-weight: 500; }
